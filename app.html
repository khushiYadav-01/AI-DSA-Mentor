
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSA mentor — AI Pair Programmer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0c10;
      --surface: #13151c;
      --border: #1f2230;
      --accent: #00ffc3;
      --accent2: #7b61ff;
      --text: #e2e8f0;
      --muted: #4a5568;
      --user-bubble: #1a1d2e;
      --ai-bubble: #111827;
      --radius: 14px;
      --font-mono: 'JetBrains Mono', monospace;
      --font-display: 'Syne', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(11,12,16,0.9);
      backdrop-filter: blur(12px);
    }

    .logo { display: flex; align-items: center; gap: 10px; }

    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }

    .logo-text {
      font-family: var(--font-display);
      font-weight: 800; font-size: 18px; letter-spacing: -0.5px;
    }

    .logo-text span { color: var(--accent); }

    .status {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 1px;
    }

    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0,255,195,0.4); }
      50% { opacity: 0.7; box-shadow: 0 0 0 5px rgba(0,255,195,0); }
    }

    .btn-reset {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 11px; padding: 6px 12px; border-radius: 6px;
      cursor: pointer; transition: all 0.2s;
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    .btn-reset:hover { border-color: var(--accent); color: var(--accent); }

    #messages {
      flex: 1; overflow-y: auto; padding: 24px;
      display: flex; flex-direction: column; gap: 20px;
      position: relative; z-index: 1; scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .welcome {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      flex: 1; gap: 16px; padding: 40px;
      text-align: center;
      animation: fadeUp 0.6s ease both;
    }

    .welcome-icon { font-size: 48px; line-height: 1; }

    .welcome h2 {
      font-family: var(--font-display);
      font-size: 28px; font-weight: 800; letter-spacing: -1px;
    }

    .welcome h2 span { color: var(--accent); }

    .welcome p {
      color: var(--muted); font-size: 13px;
      line-height: 1.7; max-width: 360px;
    }

    .suggestions {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; margin-top: 8px;
    }

    .suggestion {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 14px;
      font-size: 12px; color: var(--muted);
      cursor: pointer; transition: all 0.2s;
    }

    .suggestion:hover {
      border-color: var(--accent); color: var(--accent);
      transform: translateY(-2px);
    }

    .message {
      display: flex; gap: 12px; max-width: 800px;
      animation: fadeUp 0.3s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.ai   { align-self: flex-start; }

    .avatar {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0; margin-top: 2px;
    }

    .message.user .avatar { background: linear-gradient(135deg, var(--accent2), #a855f7); }
    .message.ai .avatar   { background: linear-gradient(135deg, #1f2230, #2d3148); border: 1px solid var(--border); }

    .bubble {
      padding: 12px 16px; border-radius: var(--radius);
      font-size: 13.5px; line-height: 1.75;
      max-width: calc(100% - 44px);
    }

    .message.user .bubble {
      background: var(--user-bubble);
      border: 1px solid rgba(123,97,255,0.2);
      border-top-right-radius: 4px;
    }

    .message.ai .bubble {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
    }

    .bubble pre {
      background: #0d1117; border: 1px solid var(--border);
      border-radius: 8px; padding: 14px; overflow-x: auto;
      margin: 10px 0; font-size: 12.5px; line-height: 1.6;
    }

    .bubble code { font-family: var(--font-mono); }
    .bubble p { margin: 6px 0; }
    .bubble p:first-child { margin-top: 0; }
    .bubble p:last-child  { margin-bottom: 0; }
    .bubble strong { color: var(--accent); font-weight: 600; }
    .bubble em     { color: #a0aec0; }

    .typing-indicator {
      display: flex; gap: 5px; align-items: center; padding: 14px 16px;
    }

    .typing-indicator span {
      width: 6px; height: 6px; background: var(--accent);
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite; opacity: 0.6;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    footer {
      position: relative; z-index: 10;
      padding: 16px 24px 20px;
      border-top: 1px solid var(--border);
      background: rgba(11,12,16,0.9);
      backdrop-filter: blur(12px);
    }

    .input-wrapper {
      display: flex; gap: 10px; align-items: flex-end;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 14px; transition: border-color 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,255,195,0.07);
    }

    #input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-family: var(--font-mono);
      font-size: 13.5px; line-height: 1.6;
      resize: none; max-height: 140px; min-height: 24px;
    }

    #input::placeholder { color: var(--muted); }

    #send-btn {
      background: var(--accent); border: none; border-radius: 8px;
      width: 34px; height: 34px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.2s; color: #000;
    }

    #send-btn:hover:not(:disabled) { background: #00e6b0; transform: scale(1.05); }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .input-hint {
      margin-top: 8px; font-size: 11px;
      color: var(--muted); text-align: center;
    }

    .input-hint kbd {
      background: var(--border); border-radius: 3px;
      padding: 1px 5px; font-family: var(--font-mono); font-size: 10px;
    }

    .error-bubble {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5; border-radius: var(--radius);
      padding: 10px 14px; font-size: 12.5px;
      align-self: center; animation: fadeUp 0.3s ease both;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">⌨</div>
    <div class="logo-text"> DSA<span> Mentor</span></div>
  </div>
  <div style="display:flex;align-items:center;gap:16px">
    <div class="status">
      <div class="status-dot"></div>
      Gemini 2.5 Flash
    </div>
    <button class="btn-reset" onclick="resetChat()">↺ Reset</button>
  </div>
</header>

<div id="messages">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">🧑‍💻</div>
    <h2>Your AI <span>DSA Mentor</span></h2>
    <p>Ask me anything about programming — algorithms, debugging, concepts, best practices, or code reviews.</p>
    <div class="suggestions">
      <div class="suggestion" onclick="fillAndSend(this)">Explain async/await in JS</div>
      <div class="suggestion" onclick="fillAndSend(this)">How does recursion work?</div>
      <div class="suggestion" onclick="fillAndSend(this)">What is Big O notation?</div>
      <div class="suggestion" onclick="fillAndSend(this)">Python list vs tuple</div>
    </div>
  </div>
</div>

<footer>
  <div class="input-wrapper">
    <textarea id="input" rows="1" placeholder="Ask a coding question…" autofocus></textarea>
    <button id="send-btn" onclick="sendMessage()" title="Send">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/>
      </svg>
    </button>
  </div>
  <div class="input-hint"><kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line</div>
</footer>

<script>
  const sessionId = 'session_' + Math.random().toString(36).slice(2);
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  let isLoading = false;

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function fillAndSend(el) {
    inputEl.value = el.textContent;
    sendMessage();
  }

  function removeWelcome() {
    const w = document.getElementById('welcome');
    if (w) w.remove();
  }

  function addMessage(role, content) {
    removeWelcome();
    const div = document.createElement('div');
    div.className = 'message ' + role;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '👤' : '🤖';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (role === 'ai') {
      bubble.innerHTML = formatAIText(content);
    } else {
      bubble.textContent = content;
    }

    div.appendChild(avatar);
    div.appendChild(bubble);
    messagesEl.appendChild(div);
    scrollToBottom();
    return div;
  }

  function addTyping() {
    removeWelcome();
    const div = document.createElement('div');
    div.className = 'message ai';
    div.id = 'typing';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '🤖';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;

    div.appendChild(avatar);
    div.appendChild(bubble);
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function addError(msg) {
    const div = document.createElement('div');
    div.className = 'error-bubble';
    div.textContent = '⚠ ' + msg;
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function formatAIText(text) {
    let html = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    html = html.replace(/```(\w+)?\n?([\s\S]*?)```/g, (_, lang, code) => {
      return `<pre><code>${code.trim()}</code></pre>`;
    });

    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

    html = html
      .split(/\n\n+/)
      .map(p => p.trim())
      .filter(Boolean)
      .map(p => p.startsWith('<pre') ? p : `<p>${p.replace(/\n/g, '<br>')}</p>`)
      .join('');

    return html;
  }

  async function sendMessage() {
    const msg = inputEl.value.trim();
    if (!msg || isLoading) return;

    isLoading = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    addMessage('user', msg);
    addTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg, sessionId })
      });

      const data = await res.json();
      removeTyping();

      if (!res.ok) {
        addError(data.error || 'Something went wrong.');
      } else {
        addMessage('ai', data.reply);
      }
    } catch (err) {
      removeTyping();
      addError("Could not reach the server. Make sure it's running on port 3000.");
    } finally {
      isLoading = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  async function resetChat() {
    await fetch('/api/chat/' + sessionId, { method: 'DELETE' }).catch(() => {});
    messagesEl.innerHTML = `
      <div class="welcome" id="welcome">
        <div class="welcome-icon">🧑‍💻</div>
        <h2>Your AI <span>Code Tutor</span></h2>
        <p>Ask me anything about programming — algorithms, debugging, concepts, best practices, or code reviews.</p>
        <div class="suggestions">
          <div class="suggestion" onclick="fillAndSend(this)">Explain async/await in JS</div>
          <div class="suggestion" onclick="fillAndSend(this)">How does recursion work?</div>
          <div class="suggestion" onclick="fillAndSend(this)">What is Big O notation?</div>
          <div class="suggestion" onclick="fillAndSend(this)">Python list vs tuple</div>
        </div>
      </div>`;
  }
</script>
</body>
</html>
